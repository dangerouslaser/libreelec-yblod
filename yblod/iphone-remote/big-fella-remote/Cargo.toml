[package]
name = "big-fella-remote"
version = "0.1.0"
edition = "2024"
description = "big-fella's iPhone remote: the TV box in the iPhone's Control Center remote (Apple's Companion Link protocol), no app to install"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "big-fella-remote"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bf-daemon = { path = "../bf-daemon" }
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
mdns-sd = "0.21"
num-bigint = "0.4"
plist = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "fs"] }
toml = "0.8"
tracing = "0.1"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "fs", "test-util"] }

[profile.release]
lto = true
strip = true
# A panicking task would leave the daemon up but doing nothing: exit, and
# let systemd restart it.
panic = "abort"
